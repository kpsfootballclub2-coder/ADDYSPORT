    :root {

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font: 14px/1.65 'Noto Sans Lao', sans-serif; }

    h2 { font-size: 23px; margin: 0; }

    p { margin: 6px 0 16px; }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 15px; border-radius: 10px; transition: background .15s, transform .15s; }

    button:disabled { opacity: .5; cursor: wait; }

    button.active { background: var(--soft); color: var(--accent); border-color: var(--accent); }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--text); }

    input[type=color] { padding: 3px; min-height: 44px; }

    select[multiple] { min-height: 105px; }

    .container { max-width: 1340px; margin: auto; padding: 0 28px; }
    .header-inner, .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header-inner { justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 23px; letter-spacing: -.6px; }
    .brandmark { width: 39px; height: 39px; background: var(--accent); color: white; display: grid; place-items: center; border-radius: 12px; transform: rotate(-7deg); font-weight: 600; }
    .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 700; }
    .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .header-inner select { width: auto; }
    .hero { margin: 28px 0 22px; background: linear-gradient(110deg, #0d382d, #17694d); padding: 36px; border-radius: 22px; color: #fff; position: relative; overflow: hidden; }
    .hero::after { content: '⚽'; position: absolute; right: 35px; top: -15px; font-size: 190px; opacity: .12; pointer-events: none; transform: rotate(-15deg); }
    .hero p { max-width: 650px; color: #cce3d8; position: relative; }
    .hero .eyebrow { color: #a4d7be; }
    .toolbar { margin: 18px 0; }
    .toolbar select { max-width: 320px; }
    .toolbar input { max-width: 300px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0; }
    nav button { border-color: transparent; background: transparent; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .grid.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); padding: 22px; border-radius: 16px; box-shadow: var(--shadow); }
    .metric { font: 500 34px 'Mitr', sans-serif; margin: 7px 0; }
    .section { margin: 24px 0; }
    .section-title { margin-bottom: 17px; justify-content: space-between; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    td, th { padding: 13px 17px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; letter-spacing: .4px; color: var(--muted); background: var(--soft); text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--soft); }
    td.wrap { white-space: normal; min-width: 180px; max-width: 400px; }
    .badge { display: inline-block; border-radius: 6px; padding: 3px 8px; font-size: 11px; background: var(--soft); color: var(--text); }
    .badge.approved, .badge.completed { background: #d8f1e3; color: #126e42; }
    .badge.pending, .badge.revision { background: #fff0c8; color: #825b00; }
    .badge.rejected, .badge.cancelled { background: #fbe4e4; color: #a13434; }
    .demo { font-size: 10px; padding: 1px 5px; background: #fef0cd; color: #7f5800; border-radius: 4px; }
    .fixture { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 18px 0; }
    .fixture .away { text-align: right; }
    .score { font: 500 22px 'Mitr', sans-serif; padding: 9px 14px; border-radius: 10px; background: var(--soft); white-space: nowrap; }
    .empty { padding: 52px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
    .notice { padding: 14px 18px; border-radius: 10px; background: var(--soft); margin-bottom: 18px; }
    .notice.error { color: var(--danger); border: 1px solid var(--danger); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); vertical-align: middle; margin-right: 9px; }
    footer { margin: 40px 0 24px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    dialog { max-width: min(850px, 94vw); width: 760px; padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--text); max-height: 90vh; box-shadow: 0 30px 100px #0005; }
    dialog::backdrop { background: #08231b99; backdrop-filter: blur(4px); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 26px; border-bottom: 1px solid var(--line); }
    .modal-body { padding: 24px 26px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .field.full { grid-column: 1 / -1; }
    .help { font-size: 11px; color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 20px 26px; border-top: 1px solid var(--line); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #163d30; color: #fff; padding: 13px 23px; border-radius: 12px; box-shadow: 0 7px 35px #0003; z-index: 1000; max-width: 92vw; }
    .busy { position: fixed; top: 0; left: 0; height: 3px; width: 100%; background: linear-gradient(90deg, transparent, var(--accent), transparent); z-index: 1100; animation: loading 1s infinite; }
    @keyframes loading { 0% { transform: translateX(-80%); } 100% { transform: translateX(80%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    @media (max-width: 900px) { .grid.cards { grid-template-columns: 1fr 1fr; } .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) {
      .container { padding: 0 16px; }
      header { padding: 15px 0; }
      .brand { font-size: 19px; }
      .header-inner { gap: 15px; }
      .hero { padding: 25px; margin-top: 20px; }
      .hero::after { right: -40px; top: 50px; }
      .grid.cards, .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .card { padding: 17px; }
      td, th { padding: 11px 13px; }
      .modal-body, .modal-head, .modal-actions { padding: 18px; }
      .toolbar select, .toolbar input { max-width: none; }
      nav { gap: 3px; }
      nav button { padding: 7px 10px; font-size: 12px; }
    }
    @media print { header, nav, .toolbar, button, footer { display: none !important; } .container { max-width: none; } .card, .panel { box-shadow: none; break-inside: avoid; } body { background: white; color: black; } }
    dialog.live-console { width: 1120px; max-width: 96vw; }
    .live-scoreboard { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:16px; text-align:center; margin-bottom:14px; }

    .live-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin:16px 0; }
    .live-toolbar input { width:110px; }
    .live-teams { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }

    .live-athlete-actions { display:flex; gap:6px; flex-wrap:wrap; }

    .live-metrics { margin:18px 0; padding:16px; border:1px solid var(--line); border-radius:14px; }
    .live-metric-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); align-items:center; gap:10px; padding:10px 0; text-align:center; border-bottom:1px solid var(--line); }
    .live-counter { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; }
    .live-counter button { padding:5px 10px; }
    @media(max-width:700px) { .live-teams { grid-template-columns:1fr; } .live-scoreboard { gap:8px; } .live-scoreboard .score { padding:10px; font-size:24px; } .live-metric-row { gap:4px; } }

    .standings-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .standings-groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr)); gap:20px; }
    .standings-group { min-width:0; padding:16px; border-radius:14px; background:var(--bg); }
    .standings-group h3 { margin-bottom:12px; }
    .standings-group th,.standings-group td { padding:10px 12px; white-space:nowrap; }
    .standings-group td:nth-child(2) { min-width:140px; }
    @media(max-width:700px) { .standings-heading { flex-direction:column; } .standings-competition { padding:14px; } .standings-group { padding:10px; } .standings-actions { width:100%; } }
    .user-role-list { display:grid; gap:24px; min-width:0; }
    .user-role-group { min-width:0; }
    .user-role-heading { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
    .user-role-heading h3 { margin:0; }
    .user-role-group th,.user-role-group td { padding:14px 16px; }
    .user-role-group td:first-child { white-space:nowrap; }
    @media(max-width:700px) { .user-role-list { gap:18px; } .user-role-group th,.user-role-group td { padding:10px 12px; } }

  </style>

    function t(key) {
      if(key === 'competitionAssistants') return {lo:'Admin ຜູ້ຊ່ວຍລາຍການ',th:'Admin ผู้ช่วยรายการ',en:'Competition assistants'}[state.lang] || 'Competition assistants';
      if(key === 'assistant') return {lo:'Admin (ຜູ້ຊ່ວຍລາຍການ)',th:'Admin (ผู้ช่วยรายการ)',en:'Admin (competition assistant)'}[state.lang] || 'Competition assistant';
      return words[key]?.[state.lang] || words[key]?.en || key;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [c]));
    }

    function attr(value) {
      return esc(value);
    }

    function badge(value) {
      return '<span class="badge ' + attr(value) + '">' + esc(t(value)) + '</span>';
    }

    function demo(record) {
      return record.demo ? ' <span class="demo">DEMO</span>' : '';
    }

    function isReadOnly() {
      return state.user && state.user.role !== 'admin' && state.user.accessLevel === 'view';
    }

    function isReadAction(action) {
      if (['team-detail', 'entry-detail', 'player-document', 'player-detail', 'athlete-competition'].includes(
          action)) return true;
      return ['competition-assistants','schedule-mode', 'schedule-date', 'nav-group', 'tab', 'print', 'verify', 'copy', 'team-roster', 'refresh-match-detail', 'match-detail', 'result-detail', 'request-detail',
                                  'roster-document',
                                                                            'audit-detail', 'database',
          'archive-view',
                      'export',
                                      'request-password'
                                          ]
        .includes(
          action);
    }

    function button(label, action, id = '', extra = '', css = 'small') {
      if (!canUseAction(action, id, extra)) return '';
      return '<button type="button" class="' + attr(css) + '" data-action="' + attr(action) + '" data-id="' +
        attr(id) + '" data-extra="' + attr(extra) + '">' + esc(t(label)) + '</button>';
    }

    function name(type, id) {
      return dataset()[type]?.find((r) => r.id === id)?.name || state.data?.[type]?.find((r) => r.id === id)
        ?.name || (id ? id.slice(0, 8) : '—');
    }

    function dataset() {
      return state.portal === 'manage' ? state.privateData : (state.data || {});
    }

    function list(type) {
      return dataset()[type] || [];
    }

    function filtered(type) {
      return list(type).filter((r) => !state.tournamentId || r.tournamentId === state.tournamentId || (type ===
        'tournaments' && r.id === state.tournamentId));
    }

    function isAdmin() {
      return state.user?.role === 'admin';
    }

    function isCompetitionAdmin() {
      return isAdmin() || state.user?.role === 'operator';
    }

    function canManage(id) {
      const tournament=state.privateData.tournaments?.find(r=>r.id === id);
      return isCompetitionAdmin() || (state.user?.role === 'assistant' ? state.user.tournamentId === id : state.user?.role === 'manager' && (tournament?.canManage === true || tournament?.createdBy === state.user.id || tournament?.managerIds?.includes(state.user.id)));
    }

    function canReviewTournament(id) {
      const tournament=record('tournaments',id);
      return isCompetitionAdmin() || (state.user?.role === 'assistant' && state.user.tournamentId === id) || (state.user?.role === 'manager' && (tournament.createdBy === state.user.id || tournament.canReview === true));
    }
    function canReviewRecord(type,id) {
      const row=record(type,id), entry=type === 'entries'?row:record('entries',row.entryId);
      return canReviewTournament(entry.tournamentId);
    }

    function canOwn(team) {
      return isCompetitionAdmin() || (state.user?.role === 'captain' && team.ownerId === state.user.id);
    }

    function when(value) {
      return value ? new Intl.DateTimeFormat(state.lang === 'lo' ? 'lo-LA' : state.lang === 'th' ? 'th-TH' :
        'en-GB', {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: 'Asia/Vientiane'
        }).format(new Date(value)) : '—';
    }

    function athleteDate(value) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
      if (!match) return '';
      const iso = match[1] + '-' + match[2] + '-' + match[3];
      const date = new Date(iso + 'T00:00:00Z');
      return !isNaN(date) && date.toISOString().slice(0,10) === iso ? iso : '';
    }
    function birthDateLabel(value) {
      const date = athleteDate(value);
      return date ? date.slice(8,10) + '/' + date.slice(5,7) + '/' + date.slice(0,4) : '—';
    }
    function athleteAge(birthDate, referenceDate) {
      const birth = athleteDate(birthDate), reference = athleteDate(referenceDate);
      if (!birth || !reference || birth > reference) return null;
      return Number(reference.slice(0,4)) - Number(birth.slice(0,4)) -
        (reference.slice(5) < birth.slice(5) ? 1 : 0);
    }
    function playerAgeCell(player, entry) {
      const tournament = record('tournaments',entry.tournamentId);
      const start = athleteDate(tournament.ageCutoffDate || tournament.startDate);
      const reference = start || new Date(Date.now() + 7 * 3600000).toISOString().slice(0,10);
      const age = athleteAge(player.birthDate, reference);

    async function rpc(method, ...args) {
      state.busy++;
      $('loading').hidden = false;
      try {
        if (!window.google?.script?.run) throw new Error(t('setupHint'));
        return await new Promise((resolve, reject) => {
          const runner = google.script.run
            .withSuccessHandler((response) => {
              if (!response || response.version !== API_VERSION) {
                reject(connectionError(new Error('DEPLOYMENT_MISMATCH')));
                return;
              }
              resolve(response.data);
            })
            .withFailureHandler((error) => reject(connectionError(error)));
          if (typeof runner.addyApi !== 'function') {
            reject(connectionError(new Error('DEPLOYMENT_MISMATCH')));
            return;
          }
          // Call one explicit Apps Script function, rather than indexing its bridge.
          runner.addyApi({
            version: API_VERSION,
            method: method,
            args: args
          });
        });
      } catch (error) {
        throw connectionError(error);
      } finally {
        state.busy--;
        $('loading').hidden = state.busy === 0;
      }
    }

    function errorMessage(error) {
      if (/SESSION_EXPIRED|ACCESS_DENIED/.test(String(error.message))) {
        state.token = '';
        state.user = null;
        state.privateData = {};
        state.portal = 'public';
        state.tab = 'overview';
        sessionStorage.removeItem('addy-token');
        render();
      }
      $('errorBox').textContent = error.message || String(error);
      $('errorBox').hidden = false;
      $('errorBox').scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function teamStatsTables(stats, editable) {
      const teamIds = [...new Set(stats.map(r => r.teamId))].sort((a,b) => name('teams',a).localeCompare(name('teams',b)));
      if (!teamIds.length) return '<div class="empty">'+esc(t('empty'))+'</div>';

        const rows = stats.filter(r => r.teamId === teamId).slice().sort((a,b) => b.goals-a.goals || a.red-b.red || a.yellow-b.yellow);
        const athletes = {};
        rows.forEach(r => {
          const player = record('players',r.playerId);
          const key = player.playerCode || r.playerId;
          if (!athletes[key]) athletes[key]={name:name('players',r.playerId),goals:0};
          athletes[key].goals += Number(r.goals || 0);
        });
        const highest = Math.max(0,...Object.values(athletes).map(p => p.goals));
        const leaders = Object.values(athletes).filter(p => p.goals === highest && highest > 0).map(p => p.name);
        const totals = ['goals','yellow','red'].map(key => esc(t(key))+': <strong>'+esc(rows.reduce((sum,r)=>sum+Number(r[key]||0),0))+'</strong>').join(' · ');

          '<div class="notice"><strong>'+esc(t('teamTopScorer'))+'</strong>: '+

          '<p>'+totals+'</p></div>'+table(['name','tournamentId','goals','yellow','red',...(editable?['']:[])],rows.map(r=>[

    function canUseAction(action, id, extra) {
      if(['competition-assistants','create-competition-assistant','toggle-competition-assistant'].includes(action)) {
        const tournament=record('tournaments',id);
        if(!isCompetitionAdmin() && !(state.user?.role === 'manager' && tournament.createdBy === state.user.id)) return false;
      }
      if (action === 'delete-records') return isCompetitionAdmin() && deletionTablesForTab().some(table=>moduleMode(deletionModule(table)) === 'edit') && !isReadOnly();
      if (['edit-user','activate-user','edit-access','add-staff','show-account-password','user-password','approve-password','reject-password'].includes(action) && !isAdmin()) return false;
      if (action === 'account-enabled') {
        const target=record('users',id);
        if (!isCompetitionAdmin() || target.id === state.user?.id || target.id === 'ADMIN' || target.role === 'admin' || (!isAdmin() && target.role === 'operator')) return false;
      }
      if (action === 'delete-sport' && !isCompetitionAdmin()) return false;
      if (['edit-standings','standings-settings'].includes(action) && !isCompetitionAdmin()) return false;
      const reviewType={'approve-entry':'entries','return-entry':'entries','review-entry':'entries','approve-player':'players','return-player':'players','review-roster':'rosterRequests','approve-roster':'rosterRequests','return-roster':'rosterRequests','reject-roster':'rosterRequests'}[action];
      if (reviewType && !canReviewRecord(reviewType,id)) return false;
      if (['approve-team','return-team','approve-transfer','reject-transfer'].includes(action) && !isCompetitionAdmin()) return false;
      if ((action === 'edit-team' || (action === 'archive' && extra === 'Teams')) && record('teams', id)
        .status === 'approved') return false;
      if (action === 'archive' && extra === 'Entries' && record('entries', id).status === 'approved')
        return false;
      if (action === 'edit-player' && id && !isCompetitionAdmin()) {
        const player = record('players', id);
        if (player.status === 'approved' || (record('entries', player.entryId).status === 'approved' && player
            .status !== 'revision')) return false;
      }
      if (action === 'archive' && extra === 'Players' && id && (record('players', id).status === 'approved' ||
          record('entries', record('players', id).entryId).status === 'approved')) return false;
      if (isReadOnly() && !isReadAction(action)) return false;
      const key = actionModule(action, id, extra);
      if (!key) return true;
      const mode = moduleMode(key);
      return isReadAction(action) ? mode !== 'none' : mode === 'edit';
    }

    function scheduleDay(value) {
      if(!value || !Number.isFinite(new Date(value).getTime())) return '';
      const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Vientiane',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
      const part=key=>parts.find(p=>p.type === key).value;
      return part('year')+'-'+part('month')+'-'+part('day');
    }
    function scheduleStamp(value) {
      return value && Number.isFinite(new Date(value).getTime()) ? new Intl.DateTimeFormat(state.lang === 'lo'?'lo-LA':state.lang === 'th'?'th-TH':'en-GB',{dateStyle:'medium',timeStyle:'short',calendar:'gregory',timeZone:'Asia/Vientiane'}).format(new Date(value)) : 'ຍັງບໍ່ກຳນົດວັນ–ເວລາ';
    }
    function scheduleDateLabel(day) {
      if(!day) return 'ຍັງບໍ່ກຳນົດວັນແຂ່ງ';
      return new Intl.DateTimeFormat(state.lang === 'lo'?'lo-LA':state.lang === 'th'?'th-TH':'en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric',calendar:'gregory',timeZone:'Asia/Vientiane'}).format(new Date(day+'T12:00:00+07:00'));
    }
    function scheduleCategory(match) {
      if(match.status === 'live') return 'live';
      if(['completed','awaiting_confirmation'].includes(match.status)) return 'finished';
      if(match.status === 'cancelled') return 'cancelled';
      return 'upcoming';
    }
    function publicMatchSchedule() {
      const games=filtered('matches'),mode=state.scheduleMode || 'all',day=state.scheduleDate || '';
      const labels={all:'ທັງໝົດ',live:'ກຳລັງແຂ່ງ',upcoming:'ກຳລັງຈະແຂ່ງ',finished:'ແຂ່ງຈົບແລ້ວ',cancelled:'ຍົກເລີກ'};
      const modes=['all','live','upcoming','finished','cancelled'];
      const dateGames=games.filter(match=>!day || scheduleDay(match.startAt) === day);
      const toolbar='<div class="schedule-controls"><div class="schedule-modes">'+modes.filter(key=>key !== 'cancelled' || games.some(m=>m.status === 'cancelled')).map(key=>button(labels[key]+' ('+(key === 'all'?dateGames.length:dateGames.filter(match=>scheduleCategory(match) === key).length)+')','schedule-mode',key,'','small'+(mode === key?' active':''))).join('')+'</div><div class="schedule-date"><label for="schedule-date">ວັນແຂ່ງ (UTC+7)</label><input id="schedule-date" type="date" value="'+attr(day)+'">'+button('ມື້ນີ້','schedule-date','today')+button('ທຸກວັນ','schedule-date','all')+'</div></div>';
      const today=scheduleDay(new Date().toISOString());
      let html='';
      ['live','upcoming','finished','cancelled'].filter(key=>mode === 'all' || key === mode).forEach(category=>{
        const selected=dateGames.filter(match=>scheduleCategory(match) === category);
        if(!selected.length)return;
        const dates=[...new Set(selected.map(match=>scheduleDay(match.startAt)))].sort((a,b)=>!a?1:!b?-1:category === 'finished'?b.localeCompare(a):category === 'upcoming' && (a < today) !== (b < today)?(a < today?1:-1):category === 'upcoming' && a < today && b < today?b.localeCompare(a):a.localeCompare(b));
        html+='<section class="schedule-section" data-schedule-category="'+category+'"><div class="schedule-heading"><h3>'+esc(labels[category])+'</h3><span class="badge">'+selected.length+' ຄູ່</span></div>';
        dates.forEach(date=>{
          const rows=selected.filter(match=>scheduleDay(match.startAt) === date).sort((a,b)=>(a.startAt || '').localeCompare(b.startAt || '') || a.id.localeCompare(b.id));
          html+='<div class="schedule-day" data-schedule-day="'+attr(date)+'"><h4>'+esc(scheduleDateLabel(date))+(date === today?' <span class="badge">ມື້ນີ້</span>':'')+'</h4>'+(category === 'upcoming' && date && date < today?'<p class="muted">ວັນແຂ່ງຜ່ານແລ້ວ ແຕ່ຍັງບໍ່ມີຜົນທີ່ບັນທຶກ.</p>':'')+'<div class="grid cards">'+rows.map(fixtureCard).join('')+'</div></div>';
        });html+='</section>';
      });
      return section('matches',toolbar+(html || '<div class="empty">ບໍ່ມີຄູ່ແຂ່ງຕາມວັນ ຫຼືສະຖານະທີ່ເລືອກ</div>'),button('print','print'));
    }

    function field(key, type = 'text', opts = {}) {
      return Object.assign({
        key,
        type,
        label: t(key)
      }, opts);
    }

    function textFields(keys) {
      return keys.map((key) => field(key));
    }

    function numberFields(keys, value = 0) {
      return keys.map((key) => field(key, 'number', {
        min: 0,
        value
      }));
    }

    function selectField(key, opts, config = {}) {
      return field(key, 'select', Object.assign({
        options: opts
      }, config));
    }

    function showForm(title, fields, values, submit, extraHtml = '') {
      clearTimeout(state.liveClockTimer);
      $('modal').classList.toggle('live-console',false);
      state.modalFields = fields;
      state.modalSubmit = submit;
      $('modalTitle').textContent = t(title);
      $('cancelModal').textContent = t('cancel');
      $('saveModal').textContent = t('save');
      $('saveModal').hidden = !submit;
      $('modalBody').innerHTML = '<div id="modalError" class="notice error" role="alert" hidden></div>' +
        extraHtml + '<div class="form-grid">' + fields.map((f) => {
          let value = values[f.key] ?? f.value ?? '';
          if (f.type === 'datetime-local') value = localInput(value);
          if (f.lines && Array.isArray(value)) value = value.join('\n');
          if (f.csv && Array.isArray(value)) value = value.join(', ');
          let control;
          const common = ' id="field-' + attr(f.key) + '" name="' + attr(f.key) + '"' + (f.required ?
            ' required' : '') + (f.disabled ? ' disabled' : '');
          if (f.type === 'select') {
            control = '<select' + common + (f.multiple ? ' multiple size="8"' : '') + '>' + (!f.required && !f.multiple ?
                '<option value="">—</option>' : '') + f.options.map((option) => '<option value="' + attr(option
                .value) + '"' + ((f.multiple ? (value || []).includes(option.value) : String(value) ===
                String(option.value)) ? ' selected' : '') + '>' + esc(option.label) + '</option>').join('') +
              '</select>';
          } else if (f.type === 'textarea') {
            control = '<textarea' + common + '>' + esc(value) + '</textarea>';
          } else if (f.type === 'checkbox') {
            control = '<input type="checkbox"' + common + (value ? ' checked' : '') + '>';
          } else {
            control = '<input type="' + attr(f.type) + '"' + common + ' value="' + attr(value) + '"' + (f.min !=
              null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + (f
              .type === 'number' ? ' step="1"' : '') + (f.type === 'password' ?
              ' autocomplete="new-password"' : '') + '>';
          }
          if (f.upload) control += '<input type="file" accept="image/png,image/jpeg,image/gif' + (f.document ?
              ',application/pdf' : '') + '" aria-label="' + attr(f.label) + '" data-upload="' + attr(f.key) +
            '"' + (f.document ? ' data-document="true"' : '') + '><span class="help">' +
            (f.document ? 'JPEG / PNG / GIF / PDF · ≤ 2 MB · ໄຟລ໌ສ່ວນຕົວ ເປີດຜ່ານລະບົບຕາມສິດ' :
              'JPEG / PNG / GIF · ≤ 2 MB · ' + esc({
                lo: 'ຮູບຈະແຊຣ໌ໃຫ້ຜູ້ມີລິ້ງເບິ່ງໄດ້',

                en: 'Uploaded images are viewable by anyone with the link'
              } [state.lang])) + '</span>';
          return '<label class="field' + (f.full ? ' full' : '') + '" for="field-' + attr(f.key) + '"><span>' +
            esc(f.label) + (f.required ? ' *' : '') + '</span>' + control + (f.help ? '<span class="help">' +
              esc(f.help) + '</span>' : '') + '</label>';
        }).join('') + '</div>';
      if (!$('modal').open) $('modal').showModal();
    }

    function formData() {
      const values = {};
      state.modalFields.forEach((f) => {
        const input = $('field-' + f.key);
        let value = f.type === 'checkbox' ? input.checked : f.multiple ? Array.from(input.selectedOptions)
          .map((o) => o.value) : input.value;
        if (f.type === 'number') value = value === '' ? '' : Number(value);
        if (f.type === 'datetime-local' && value) value = new Date(value + ':00+07:00').toISOString();
        if (f.lines) value = value.split(/\n/).map((v) => v.trim()).filter(Boolean);
        if (f.csv) value = value.split(',').map((v) => v.trim()).filter(Boolean);
        if (f.numbers) value = value.map(Number);
        values[f.key] = value;
      });
      return values;
    }

    function tickLiveClock() {
      const clock=state.liveConsole?.clock;if(!clock||!$('modal').open)return;
      const seconds=Math.min(60000,clock.elapsedSeconds+(clock.running?Math.floor((Date.now()-state.clockReceivedAt)/1000):0));
      $('live-clock-display').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
      state.liveClockTimer=setTimeout(tickLiveClock,1000);
    }
    async function saveConsoleClock(action) {
      if(state.savingLiveEvent)throw new Error('ກຳລັງບັນທຶກ ກະລຸນາລໍຖ້າ');
      const minute=Number($('live-event-minute').value);state.savingLiveEvent=true;
      try {const updated=await rpc('controlMatchClock',state.token,{matchId:state.liveConsole.matchId,action,minute});renderLiveConsole(updated,Math.floor((updated.clock?.elapsedSeconds||0)/60));await refresh();}
      finally{state.savingLiveEvent=false;}
    }

    async function saveConsoleMetric(key,extra) {
      if(state.savingLiveEvent) throw new Error('ກຳລັງບັນທຶກ ກະລຸນາລໍຖ້າ');
      const snapshot=state.liveConsole,minute=Number($('live-event-minute').value)||0;
      const value=key.startsWith('possession')?Number($('live-possession-'+key.slice(-1).toLowerCase()).value):Number(extra);
      if(!snapshot?.canEditMetrics) throw new Error(t('readOnlyNotice'));
      if(!Number.isInteger(value)||(key.startsWith('possession')&&(value<0||value>100))) throw new Error('ຄ່າສະຖິຕິບໍ່ຖືກຕ້ອງ');
      const pendingKey=snapshot.matchId+'|'+key+'|'+value, pending=state.pendingMetric;
      const requestId=pending?.key===pendingKey?pending.requestId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
      state.pendingMetric={key:pendingKey,requestId};state.savingLiveEvent=true;
      try {
        const updated=await rpc('updateLiveMatchMetrics',state.token,{matchId:snapshot.matchId,key,value,requestId});
        state.pendingMetric=null;renderLiveConsole(updated,minute);toast(t('success'));await refresh();
      } finally {state.savingLiveEvent=false;}
    }

    async function saveConsoleEvent(playerId,type) {
      if(state.savingLiveEvent) throw new Error('ກຳລັງບັນທຶກ ກະລຸນາລໍຖ້າ');
      const snapshot=state.liveConsole,minute=Number($('live-event-minute').value);
      if(!snapshot||!Number.isInteger(minute)||minute<0||minute>1000) throw new Error('ນາທີບໍ່ຖືກຕ້ອງ');
      const useClock=!!snapshot.clock;
      const key=snapshot.matchId+'|'+playerId+'|'+type+'|'+(useClock?'clock':minute);
      const pending=state.pendingLiveEvent;
      const requestId=pending&&pending.key===key?pending.requestId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
      state.pendingLiveEvent={key,requestId};state.savingLiveEvent=true;
      try {
        const updated=await rpc('addLiveMatchEvent',state.token,{matchId:snapshot.matchId,playerId,type,minute,requestId,useClock});
        state.pendingLiveEvent=null;renderLiveConsole(updated,minute);toast(t('success'));
        await refresh();
      } finally {state.savingLiveEvent=false;}
    }

    function download(file) {
      const blob = new Blob([file.content], {
        type: file.mime + ';charset=utf-8'
      });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = file.name;
      anchor.target = '_self';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    }
    document.addEventListener('click', async (event) => {
      const element = event.target.closest('[data-action]');
      if (!element || element.disabled) return;
      element.disabled = true;
      try {
        await action(element.dataset.action, element.dataset.id, element.dataset.extra, element);
      } catch (error) {
        if ($('modal').open) {
          const box = $('modalError');
          box.textContent = error.message;
          box.hidden = false;
          box.scrollIntoView({
            block: 'nearest'
          });
        } else errorMessage(error);
      } finally {
        element.disabled = false;
      }
    });
    $('modal').addEventListener('close', () => {
      clearTimeout(state.liveClockTimer);
      if (state.documentPreviewUrl) {
        URL.revokeObjectURL(state.documentPreviewUrl);
        state.documentPreviewUrl = '';
      }
    });
    $('modalForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!state.modalSubmit) return;
      $('saveModal').disabled = true;
      $('modalError').hidden = true;
      try {
        await state.modalSubmit(formData());
        $('modal').close();
        if (state.pendingAssistantList) {
          const id=state.pendingAssistantList;state.pendingAssistantList='';await competitionAssistants(id);
        }
        if (state.pendingDeletionTable) {
          const table=state.pendingDeletionTable;state.pendingDeletionTable='';await deletionForm(table);
        }
        if (state.pendingStatsPlayer) {
          const playerId=state.pendingStatsPlayer;state.pendingStatsPlayer='';await playerStatsForm(playerId);
        } else if (state.pendingTeamRosterEntry) {
          const entryId = state.pendingTeamRosterEntry; state.pendingTeamRosterEntry = '';
          if (moduleMode('players') !== 'none') await teamAthleteSelection(entryId);
        } else if (state.pendingIncomingTransfer) {
          const result = state.pendingIncomingTransfer;
          state.pendingIncomingTransfer = null;
          incomingTransferMatches(result);
        } else if (state.pendingCorrectionPlayer) {
          const playerId = state.pendingCorrectionPlayer;
          state.pendingCorrectionPlayer = '';
          await correctionForm(playerId);
        } else if (state.pendingAthleteCode && state.user) {
          const code = state.pendingAthleteCode;
          state.pendingAthleteCode = '';
          await showAthleteCompetition(code);
        } else if (state.pendingResultMatch) {
          const matchId = state.pendingResultMatch;
          state.pendingResultMatch = '';
          resultForm(matchId);
        }
        if (state.pendingPasswordReview) {
          const id = state.pendingPasswordReview;
          state.pendingPasswordReview = '';
          passwordReviewForm(id);
        }
        if (state.pendingInfo) {
          const info = state.pendingInfo;
          state.pendingInfo = null;
          showDetails(info.title, info.html);
        }
      } catch (error) {
        $('modalError').textContent = error.message || String(error);
        $('modalError').hidden = false;
        $('modalError').scrollIntoView({
          block: 'nearest'
        });
      } finally {
        $('saveModal').disabled = false;
      }
    });
    document.addEventListener('change', async (event) => {
      if (event.target.dataset.playerTeam) {
        state.playerTeamFilter = event.target.value; render(); return;
      }
      const key = event.target.dataset.upload;
      if (!key || !event.target.files[0]) return;
      const file = event.target.files[0];
      $('saveModal').disabled = true;
      try {
        if (file.size > 2 * 1024 * 1024) throw new Error('Image must be under 2 MB.');
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const isDocument = event.target.dataset.document === 'true';
        const entryId = isDocument ? $('field-entryId').value : '';
        if (isDocument && !entryId) throw new Error(t('entryId'));
        const result = await rpc(isDocument ? 'uploadPlayerDocument' : 'uploadImage', state.token, {
          base64,
          entryId,
          playerId: isDocument ? state.playerFormId : '',
          forCorrection: isDocument && state.correctionUpload === true,
          requestId: isDocument && state.correctionUpload ? state.correctionRequestId : '',
          field: key
        });
        $('field-' + key).value = result.url;
        toast(t('success'));
      } catch (error) {
        $('modalError').textContent = error.message;
        $('modalError').hidden = false;
      } finally {
        $('saveModal').disabled = false;
      }
    });
    $('content').addEventListener('submit', async (event) => {
      if (event.target.id !== 'verifyForm') return;
      event.preventDefault();
      try {
        await verify($('verificationCode').value);
      } catch (error) {
        errorMessage(error);
      }
    });
    $('closeModal').onclick = () => $('modal').close();
    $('cancelModal').onclick = () => $('modal').close();
    $('language').onchange = (event) => {
      state.lang = event.target.value;
      localStorage.setItem('addy-language', state.lang);
      render();
    };
    $('themeButton').onclick = () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('addy-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    };
    $('tournamentFilter').onchange = (event) => {
      state.tournamentId = event.target.value;
      render();
    };
    $('publicButton').onclick = () => {
      state.portal = 'public';
      state.tab = 'overview';
      render();
    };
    $('manageButton').onclick = () => {
      state.portal = 'manage';
      state.tab = manageTabs()[0];
      render();
    };
    $('refreshButton').onclick = refresh;
    $('authButton').onclick = async () => {
      if (!state.user) return loginForm();
      try {
        await rpc('logout', state.token);
      } catch (error) {
        /* Clear local session even when the server is unavailable. */
      }
      state.token = '';
      sessionStorage.removeItem('addy-token');
      state.user = null;
      state.privateData = {};
      state.portal = 'public';
      state.tab = 'overview';
      await refresh();
    };
    async function initialize() {
      if (!['lo', 'th', 'en'].includes(state.lang)) state.lang = 'lo';
      document.body.classList.toggle('dark', localStorage.getItem('addy-theme') === 'dark');
      render();
      await refresh();
      if (!window.google?.script) return;
      google.script.url.getLocation(async (location) => {
        const p = location.parameter || {};
        try {
          if (p.verify) await verify(p.verify);
          if (p.athlete) await showAthleteCompetition(p.athlete);
          if (p.account && p.token) {
            showDetails('requestReset', '<div class="notice">' + esc(t('adminAccountsOnly')) + '</div>' +
              button('requestReset', 'request-password'));
          }
        } catch (error) {
          errorMessage(error);
        }
      });
    }
    initialize();
  </script>
</body>
</html>
